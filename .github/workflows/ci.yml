name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: nginx-app

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck scripts/
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./scripts"

      - name: Hadolint app/Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        working-directory: app
        run: |
          docker build --build-arg BUILD_SHA=${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Save image as tar artifact
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-app-image
          path: image.tar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: nginx-app-image

      - name: Load image
        run: docker load -i image.tar

      - name: Run container
        run: |
          docker run -d --name nginx-app -p 8080:8080 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait for readiness
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then
              echo "Container is ready."
              exit 0
            fi
            echo "Waiting for container... ($i)"
            sleep 2
          done
          echo "Container did not become ready in time." >&2
          docker logs nginx-app
          exit 1

      - name: Make healthcheck.sh executable
        run: chmod +x scripts/healthcheck.sh

      - name: Run healthcheck.sh against the container
        run: ./scripts/healthcheck.sh http://localhost:8080/healthz

      - name: Container logs (for debugging, always shown)
        if: always()
        run: docker logs nginx-app || true

      - name: Stop and remove container
        if: always()
        run: docker rm -f nginx-app || true

  publish:
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: nginx-app-image

      - name: Load image
        run: docker load -i image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push to GHCR
        run: |
          IMAGE_ID=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} "$IMAGE_ID:${{ github.sha }}"
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:${{ github.sha }}"
          docker push "$IMAGE_ID:latest"
